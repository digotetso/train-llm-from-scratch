version: 1
groups:
  general:
    - "The child opened the window and watched the rain fall across the garden."
    - "A careful explanation uses familiar words before introducing technical terms."
    - "Yesterday the committee published its final report for public review."
    - "Scientists compare new measurements with earlier observations."
    - "The teacher asked the class to describe how they reached the answer."
    - "Good software should be readable, testable, and safe to change."
    - "The train arrived after sunset and the passengers collected their bags."
    - "Economic decisions often involve uncertainty, incentives, and trade-offs."
    - "A small business records income and expenses throughout the year."
    - "The doctor explained the procedure in clear and reassuring language."
    - "Public institutions are accountable to the communities they serve."
    - "The novel follows two friends as they travel through southern Africa."
    - "Water changes state when temperature and pressure cross physical thresholds."
    - "A useful summary preserves the central claim and its supporting evidence."
    - "The team reviewed the incident and agreed on three corrective actions."
    - "People learn more effectively when examples connect ideas to experience."
    - "The application validates input before saving a new record."
    - "A balanced meal can include grains, vegetables, fruit, and protein."
    - "The court considered the text of the law and the facts of the case."
    - "Clear documentation states assumptions, limitations, and expected results."

  telecom:
    - "The gNodeB establishes an RRC connection with the user equipment."
    - "The AMF handles registration and mobility management in the 5G core."
    - "The SMF selects a UPF and controls the PDU session."
    - "A network slice combines logical resources for a defined service profile."
    - "The NG-RAN connects to the 5G core through the N2 and N3 interfaces."
    - "Handover moves an active UE between cells while preserving service continuity."
    - "Carrier aggregation combines multiple component carriers to increase bandwidth."
    - "Massive MIMO uses antenna arrays and beamforming to improve radio performance."
    - "CQI, RSRP, RSRQ, and SINR describe different aspects of radio quality."
    - "HARQ combines forward error correction with fast retransmission."
    - "The scheduler assigns physical resource blocks according to demand and policy."
    - "An IMS registration uses SIP signaling and subscriber authentication."
    - "Diameter and HTTP/2 carry control-plane messages between core functions."
    - "GTP-U tunnels user-plane packets between the RAN and the UPF."
    - "A QoS flow is identified by a QFI and mapped to radio bearers."
    - "MPLS forwards labeled packets along a label-switched path."
    - "Segment routing encodes an ordered list of instructions in the packet."
    - "BGP exchanges reachability information between autonomous systems."
    - "OSPF computes shortest paths from a link-state database."
    - "IS-IS floods link-state protocol data units within a routing domain."
    - "EVPN distributes MAC and IP reachability for Ethernet VPN services."
    - "VXLAN carries layer-two frames across an IP underlay."
    - "A route reflector reduces the number of internal BGP sessions."
    - "Equal-cost multipath spreads traffic across routes with the same metric."
    - "Bidirectional Forwarding Detection detects forwarding-path failures quickly."
    - "O-RAN defines open interfaces between disaggregated RAN components."
    - "The near-real-time RIC hosts xApps that optimize radio behavior."
    - "The non-real-time RIC uses rApps and policy guidance over the A1 interface."
    - "Open Fronthaul connects the O-RU and O-DU across standardized interfaces."
    - "NETCONF edits configuration data represented by YANG models."
    - "gNMI provides structured configuration and streaming telemetry over gRPC."
    - "SNMP polls managed objects and receives asynchronous notifications."
    - "An OSS supports assurance, inventory, orchestration, and fault management."
    - "A BSS manages products, customers, charging, and service orders."
    - "eTOM describes business processes used by communications service providers."
    - "A network function virtualization orchestrator manages virtual resources."
    - "Kubernetes operators can reconcile cloud-native network function state."
    - "IPsec protects packets with authentication, integrity, and encryption."
    - "A zero-trust design verifies identity and policy for each access request."
    - "DDoS mitigation combines detection, filtering, rate limiting, and scrubbing."
    - "An engineer correlates alarms, counters, traces, and topology during root-cause analysis."
    - "Packet loss may result from congestion, errors, policing, or an MTU mismatch."
    - "Latency includes propagation, serialization, processing, and queueing delay."
    - "A service-level objective defines a measurable reliability target."
    - "Roaming authentication exchanges subscriber information between home and visited networks."
    - "An eSIM downloads an operator profile to an embedded universal integrated circuit card."
