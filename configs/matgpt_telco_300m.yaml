run:
  name: matgpt_telco_300m
  seed: 42
  output_dir: runs/matgpt_telco_300m

tracking:
  wandb:
    enabled: false
    project: matgpt-telco-300m
    entity: null
    tags:
      - from-scratch
      - telecom
      - networking
      - 300m
      - bf16

dataset:
  hf_name: public-role-safe-telco-mixture
  hf_config: null
  revision: registry:configs/data/telco_300m_sources.yaml
  source_registry_path: configs/data/telco_300m_sources.yaml
  mixture_config_path: configs/data/telco_300m_mixture.yaml
  text_field: text
  train_split: main
  validation_split: validation
  training_splits:
    main: main
    cooldown: cooldown
  license: document-level-public-source-manifest
  stage: base_pretraining
  language: en
  raw_dir: matgpt/data/raw/matgpt_telco_300m
  normalized_dir: matgpt/data/normalized/matgpt_telco_300m
  max_train_documents: null
  max_validation_documents: null
  quality:
    enabled: true
    min_chars: 40
    max_chars: null
    exact_dedup: true
    contamination_patterns_path: null

tokenizer:
  vocab_size: 32768
  algorithm: byte_level_bpe
  output_dir: matgpt/tokenizer/matgpt_telco_300m
  min_frequency: 2
  probe_sets_path: configs/data/telco_tokenizer_probes.yaml
  special_tokens:
    - "<|pad|>"
    - "<|bos|>"
    - "<|eos|>"
    - "<|system|>"
    - "<|user|>"
    - "<|assistant|>"
    - "<|end|>"

sharding:
  output_dir: matgpt/data/shards/matgpt_telco_300m
  shard_size_tokens: 50000000
  dtype: uint16
  append_eos: true

model:
  vocab_size: 32768
  context_length: 2048
  n_layers: 20
  n_heads: 16
  d_model: 1024
  d_ff: 3072
  dropout: 0.0
  norm_eps: 1.0e-5
  rope_base: 10000.0
  tie_embeddings: true
  use_bias: false
  activation: swiglu

training:
  precision: bf16
  compile: false
  micro_batch_size: 8
  gradient_accumulation_steps: 8
  max_tokens: 12000000000
  data_phases:
    - name: main
      split: main
      until_tokens: 10000000000
    - name: cooldown
      split: cooldown
      until_tokens: 12000000000
  optimizer: adamw
  learning_rate: 3.0e-4
  min_learning_rate: 3.0e-5
  weight_decay: 0.1
  beta1: 0.9
  beta2: 0.95
  grad_clip: 1.0
  warmup_ratio: 0.02
  eval_interval_tokens: 50000000
  eval_batches: 32
  checkpoint_interval_tokens: 250000000
  sample_interval_tokens: 50000000
  log_interval_steps: 10
  save_best: true
  keep_milestones: true
  allow_artifact_mismatch: false
  max_consecutive_skipped_updates: 5
  num_workers: 2
  pin_memory: true

evaluation:
  max_new_tokens: 180
  temperature: 0.7
  top_k: 50
  top_p: 0.95
  prompts:
    - "In simple terms, a router forwards a packet by"
    - "The difference between the control plane and the data plane is"
    - "A 5G gNodeB establishes an RRC connection when"
    - "BGP route selection prefers"
    - "An engineer troubleshooting packet loss should first"
    - "O-RAN separates the radio access network into"
